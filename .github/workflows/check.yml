name: Check public starter

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/build_starter.py --check
      - run: python scripts/check_public.py
      - run: python -m unittest discover -s tests
      - run: git diff --check
